schema: spec-driven

# ─────────────────────────────────────────────────────────────────────────────
# context：创建 change / spec 时注入给 AI 的项目背景
#
# ⚠️ 起新产品仓时，本段整段替换成你自己的产品背景（跑 tools/init-new-repo.sh 会清空成占位）。
#    下面填的是 kit 自带的培训玩具需求「团队会议室预订」，仅供练手，不是真实产品。
#
# 流程闸门与 proto-gen 入口写在仓根 AGENTS.md，不要重复写进这里。
# ─────────────────────────────────────────────────────────────────────────────
context: |
  # 组织与产品线
  【培训沙盒】团队会议室预订 —— 一个虚构的内部小工具，用于练习本套 spec-driven 流程。
  用户是公司内部员工（约 50 人），场景是订会议室、看谁订了、取消自己的预订。
  没有对外商业逻辑，没有多产品线，没有共享底座。

  # 需求事实源
  需求 = openspec/requirements.md（A1 预订，4 个需求点）。**规则以它为准。**

  # 拆包
  1 个 change：01-room-booking。能力竖切保闭环。
  Owner：培训学员本人。

  # 流程规范（openspec/conventions/）
  - 评审决议遵循 review-convention.md（第五张纸：review-notes + review-raw + 七步闭环 + 回写需求事实源）
  - 发布分发遵循 publish-convention.md（git 事实源、服务器渲染物、全英文命名）
  - 多人协作遵循 collaboration-convention.md（目录所有权、跨人走契约不互读 spec、单根还是独立仓的判据）

  # 纪律
  - 需求列表是事实源，不是一次性输入：评审待定项有结论、review-raw 决议要改需求、
    或画原型过程中产生需求补充/变更时，必须先回写 openspec/requirements.md 的对应条目
    （删掉「待定」字样），再改 specs/*/spec.md 的 Requirement 与 Scenario，两处缺一不可
    （只改需求列表不改 spec 是最常见疏漏，spec 才是开发验收依据），
    最后在 review-notes 落点同时写需求编号与 spec 路径。详见 review-convention.md 第四节。
  - 需求列表必须自包含：规则性内容（清单/枚举/取值表/状态机结论）写全在条目正文，
    宁可与 spec 重复录入；大块参考资料放 openspec/references/ 用相对路径引用。
    禁止只留「详见某 spec」的指针，也禁止指向仅内网可访问的 URL。
    判据：**同事不读你的 spec，能不能读懂需求。**
  - specs/ 是现行规格账本，只随 change 归档更新，不手改。
  - 二期需求点不进本期 change。

# ─────────────────────────────────────────────────────────────────────────────
# 变更包命名规范（通用，起新仓不用改）
# ─────────────────────────────────────────────────────────────────────────────
naming: |
  变更包目录名 = `NN-<kebab-case 名称>`，序号是包名的一部分，不是外部编号。
  · 序号来源：有拆包方案时按方案序号；没有拆包方案时取当前已存在包的最大序号 +1。
  · 序号一经创建不再变更，即使拆包方案调整——序号是这个包的身份，不是排期位次。
  · `prototypes/` 下的目录名与 HTML 文件名必须与变更包同名。
    界面型与策略型**产物都是 `NN-xxx.html`**，区别只在内容形态（见 rules.prototypes）。
  · 建包命令：openspec new change "NN-<名称>"

# ─────────────────────────────────────────────────────────────────────────────
# 逐 artifact 规则：AI 起草对应文档时强制遵守（通用，起新仓不用改）
# ─────────────────────────────────────────────────────────────────────────────
rules:
  proposal:
    - 引用需求点一律用 openspec/requirements.md 的条目编号（如 A1-2）
    - 必须包含「Out of Scope（本期明确不做）」小节
    - 未拍板的问题列入「评审待定项」，禁止替用户拍板
    - 开头必须声明本包的**评审产出物类型**：`界面原型` 或 `策略说明`（判据见 rules.prototypes）。
      拆包方案里已标注的直接沿用；没标注的**列入「评审待定项」问用户，禁止自己默认成界面原型**

  prototypes:
    # ── 先判类型，再动手。判据只有一条 ──
    - 判据：**这个包的产出物里，有没有用户或运营会直接看到的界面？**
      有（用户端页面、管理后台页面）→ `界面原型`；
      没有（纯服务端策略、算法规则、跨端契约、非功能约束）→ `策略说明`。
      一个包同时含两类需求点时，按**该包的主要交付物**定类型，另一类在文档里补充说明，不拆成两份
    - 类型在拆包方案 / proposal 里已声明；**AI 不得自行改判**，要改先问用户

    # ── 两类共同点：产物都是 HTML，都走 proto-gen 的样式注入 ──
    - 两类的产物**都是 `prototypes/NN-xxx/NN-xxx.html`**，都必须回填三对注入标记
      （`@proto-gen:theme` / `shared` / `highlight`）并保留顶部 48px 固定导航栏——
      视觉体系与索引发布方式全仓统一，**区别只在每个 section 里装什么**

    # ── 界面型 ──
    - 界面型：section = macos-window 外壳 + 右侧 360px prd-panel 一一对应。
      完整规则见仓根 AGENTS.md 第二节与 `.agent-skills/proto-gen/SKILL.md`，本段其余条目不适用

    # ── 策略型 ──
    - 策略型：**不套 macos-window / prd-panel**——没有界面可装，套了只会留一堆空壳。
      section = 规则说明块，它要回答的是「这套规则怎么运转」，不是「这个页面长什么样」
    - 策略型必须写全四段，缺一不可：
      ① **输入与输出**——这套策略吃什么、吐什么、边界在哪（等价于界面型的"用户能看到什么"）
      ② **规则正文**——判定条件、取值表、优先级、分支。取值表一律穷举，禁止「等等」「以此类推」
      ③ **边界与异常**——空值、越界、冲突、降级路径；每条都要写明结果，不能只说"报错"
      ④ **可配置项**——哪些值可调、调了影响什么、默认值是多少
    - 策略型同样遵守 specs 的自包含要求：规则内容写全在正文，
      禁止用「详见某 spec / 某 HTML」代替规则本身。判据仍是**同事不读你的 spec 能不能读懂**

    # ── UML：按需，不是必须 ──
    - 图**只在文字讲不清时才画**，一个包通常 0~2 张。为画而画的图会掩盖规则本身没写清
    - 按表达对象选型，用 Mermaid 语法：
      · 分支判断、多路由 → `flowchart`
      · 状态流转、生命周期 → `stateDiagram-v2`
      · 多方交互、契约调用时序 → `sequenceDiagram`
      · 数据结构与引用关系 → `erDiagram`
    - 渲染方式随 proto-gen 的资源策略，**产物必须自包含**：
      内嵌渲染库或预渲染成内联 SVG 皆可，**禁止引外部 CDN**——
      原型要发到服务器给团队看，外链失效时图就没了
    - 图旁必须有文字结论；**图不能是唯一事实源**——评审改的是文字，图跟着改
  specs:
    - 每条 Scenario 必须可判真伪（能直接转成测试用例）
    - 状态机与可见性规则必须集中定义，禁止散落在多处
    - specs 必须自包含：实现所需的清单、枚举、取值表、字段结构一律写全在 spec 正文，
      禁止用「详见需求列表 / 某外部文档」代替规则本身。
      需求编号只可作溯源标签出现，规则内容必须与它同段落写全（开发只拿 openspec/ 就能开工）
    - 跨包引用必须可解析：指向别的变更包时写全目录名（如 `01-room-booking`），
      指向契约或决策时写「<变更包名>/design.md 的 C1 / D6」，禁止裸写「01 包」「C2」
    - 列表页必须写全「列表五要素」，缺一不可：
      ① 取值来源——数据从哪张表/哪个查询来，含预置与新增的关系
      ② 排序——默认排序规则；是否提供列排序
      ③ 每个字段的取值与显示格式——该列的值从哪个字段来、多值怎么连接、语言回退、等宽/标签等呈现
      ④ 缺省——无数据时的空态、某字段为空时显示什么
      ⑤ 分页——每页条数、总数展示、未满一页的表现
      树形页按等价口径写（取值来源/排序/节点显示格式/空态/是否滚动分页）
    - 列表的每一列都必须能指回某个已定义字段或明确的派生规则；
      指不回去的列一律不画不写——不得把参考文档里的说明性文字当作字段
    - 凡可输入的字段，必须写明字符数上限**且写明按字符还是按字节**；
      需求未定义则列入「评审待定项」，禁止自己拍一个数、也禁止当作无限制
    - 凡在界面上展示 ID，其字面格式必须已定义（属「定了就改不了」）；未定义则先定再画
